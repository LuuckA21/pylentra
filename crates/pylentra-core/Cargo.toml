[package]
name = "pylentra-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
ts-rs = { version = "12", features = ["uuid-impl"] }
log = "0.4"
