[package]
name = "pylentra-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
exclude = ["tests/compat"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
ts-rs = { version = "12", features = ["uuid-impl"] }
log = "0.4"
secrecy = "0.10"
keyring = { version = "4.2", features = ["v1"] }
russh = "0.64"
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util"] }

[features]
test-util = []

[dev-dependencies]
tempfile = "3"
futures = "0.3"
pylentra-core = { path = ".", features = ["test-util"] }
rand = "0.10"
tokio = { version = "1", features = ["full"] }
