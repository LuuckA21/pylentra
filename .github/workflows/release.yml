name: Release

# Run from the Actions tab ("Run workflow" on main) or by pushing a vX.Y.Z tag.
# A manual run takes the tag from the workspace version; GitHub creates the tag
# when the draft release is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    runs-on: ubuntu-22.04
    outputs:
      name: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run the release from main, not $GITHUB_REF_NAME."
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          name="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$name" > /dev/null; then
            echo "::error::Tag $name already exists. Bump version in Cargo.toml before releasing again."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    env:
      # aws-lc-sys (via russh) needs NASM on Windows x86-64; use the prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check updater public key is configured
        shell: bash
        run: |
          if grep -q REPLACE_WITH_OUTPUT_OF src-tauri/tauri.conf.json; then
            echo "::error file=src-tauri/tauri.conf.json::plugins.updater.pubkey is still the placeholder. Run 'pnpm tauri signer generate -w ~/.tauri/pylentra.key', paste the public key into tauri.conf.json and add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets (see README, Releasing)."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.tag.outputs.name }}
          releaseName: Pylentra ${{ needs.tag.outputs.name }}
          releaseDraft: true
          includeUpdaterJson: true

  checksums:
    needs: [tag, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.name }}
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets --clobber
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
