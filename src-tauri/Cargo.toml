[package]
name = "pylentra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
pylentra-core = { path = "../crates/pylentra-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.14"
dirs = "6"
log = "0.4"
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
pylentra-core = { path = "../crates/pylentra-core", features = ["test-util"] }
secrecy = "0.10"
tempfile = "3"
